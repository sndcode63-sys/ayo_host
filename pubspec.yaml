  name: ayo_host
  description: "AYO Host mobile application"
  publish_to: 'none'

  version: 1.0.0+1

  environment:
    sdk: ^3.12.2

  dependencies:
    flutter:
      sdk: flutter

    # UI
    cupertino_icons: ^1.0.8
    google_fonts: ^6.2.1

    # State Management
    provider: ^6.1.2

    # API & Networking
    http: ^1.2.2

    # Date & Time Formatting
    intl: ^0.20.2

    # Firebase Core
    firebase_core: ^4.2.1

    # Firebase Phone Authentication
    firebase_auth: ^6.1.2

    # Firebase Push Notifications
    firebase_messaging: ^16.0.3

    # Local Notifications
    flutter_local_notifications: ^19.5.0

  dev_dependencies:
    flutter_test:
      sdk: flutter

    flutter_lints: ^6.0.0

  flutter:
    uses-material-design: true

    # Add your assets here when needed
    # assets:
    #   - assets/images/
